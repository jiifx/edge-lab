name: build

# Manual runs build artifacts you can download. Pushing a v* tag additionally
# publishes a GitHub Release - which is what gives winget (and everyone else) a
# public, stable, per-version InstallerUrl to point at.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which platform(s) to build
        type: choice
        options: [both, windows, macos]
        default: both
  push:
    tags: ["v*"]

# Least privilege by default; only the release job is granted write.
permissions:
  contents: read

jobs:
  windows:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      # The engine and journal-statistics invariants, in under a second. This
      # workflow only ever BUILT before, so nothing stopped a release that had
      # quietly broken the maths - which is exactly how a batch of them shipped.
      - run: npm test

      - name: Build NSIS installer
        run: npx tauri build --bundles nsis

      # winget resolves the silent uninstall from QuietUninstallString, which
      # Tauri's template does not write - src-tauri/windows/hooks.nsh adds it.
      # Silent-install and read the key back: the real behaviour, not a byte scan.
      - name: Verify silent install writes QuietUninstallString (winget uninstall)
        shell: pwsh
        run: |
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $exe) { throw "no NSIS installer produced" }
          "sha256: " + (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Start-Process -FilePath $exe.FullName -ArgumentList "/S" -Wait
          Start-Sleep -Seconds 3
          $k = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Edge Lab"
          $p = Get-ItemProperty $k -ErrorAction SilentlyContinue
          if (-not $p) { throw "app did not register an uninstall entry after silent install" }
          if (-not $p.QuietUninstallString -or $p.QuietUninstallString -notmatch '/S') {
            throw "QuietUninstallString missing or not silent: '$($p.QuietUninstallString)'"
          }
          "ok: QuietUninstallString = $($p.QuietUninstallString)"
          # clean the runner back up
          if ($p.QuietUninstallString -match '^"([^"]+)"') {
            Start-Process -FilePath $matches[1] -ArgumentList "/S" -Wait -ErrorAction SilentlyContinue
          }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  macos:
    if: github.event_name == 'push' || inputs.platform == 'both' || inputs.platform == 'macos'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      # The engine and journal-statistics invariants, in under a second. This
      # workflow only ever BUILT before, so nothing stopped a release that had
      # quietly broken the maths - which is exactly how a batch of them shipped.
      - run: npm test

      - name: Build universal macOS app + dmg
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg

      # Unsigned by design (no Apple Developer account). lipo leaves the universal
      # binary without a valid top-level signature, which Apple Silicon can refuse
      # outright; an ad-hoc signature keeps right-click -> Open reachable.
      - name: Ad-hoc codesign
        run: |
          APP_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP="$APP_DIR/$(ls -1 "$APP_DIR" | grep '\.app$' | head -1)"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Zip .app (ditto preserves the bundle)
        run: |
          cd "src-tauri/target/universal-apple-darwin/release/bundle/macos"
          APP="$(ls -d *.app | head -1)"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "PropEdgeLab-macos.app.zip"

      - name: Verify the binary is really universal
        run: |
          BIN="$(find src-tauri/target/universal-apple-darwin/release/bundle/macos -type f -perm +111 -path '*/Contents/MacOS/*' | head -1)"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "x86_64" && lipo -info "$BIN" | grep -q "arm64"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/PropEdgeLab-macos.app.zip
          if-no-files-found: error

  release:
    # tag pushes only - a manual run just leaves downloadable artifacts
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Checksums and release notes
        run: |
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0 \
            | xargs -0 -I{} sh -c 'cd "$(dirname "{}")" && sha256sum "$(basename "{}")"' \
            | tee SHA256SUMS.txt
          {
            printf '## Checksums\n\n```\n'
            cat SHA256SUMS.txt
            printf '```\n\n'
            printf '### First run\n\nThe installers are not code-signed, so the OS warns the first time:\n\n'
            printf -- '- **Windows:** "Windows protected your PC" -> click **More info** -> **Run anyway**.\n'
            printf -- '- **macOS:** right-click the app -> **Open** -> **Open**.\n\n'
            printf 'Try it with the 1,000-trade sample journal in `samples/` (Journal -> Import). Not financial advice.\n'
          } > NOTES.md

      # gh is preinstalled on the runner: one less third-party action in the
      # supply chain for the step that actually publishes the binaries.
      # The API pre-pends --notes-file content to the --generate-notes body.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' \) -print0 \
            | xargs -0 gh release create "$TAG" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$TAG" \
                --generate-notes \
                --notes-file NOTES.md \
                SHA256SUMS.txt
