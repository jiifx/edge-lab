[package]
name = "prop-edge-lab"
version = "2.16.0"
description = "Edge Lab - trading journal + edge simulator. Produced by jiidc."
authors = ["jiidc"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "6"
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = 3
strip = true
